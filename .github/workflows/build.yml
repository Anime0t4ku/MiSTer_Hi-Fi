name: MiSTer-Hi-Fi

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build MiSTer Hi-Fi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip file

      - name: Install ARM GCC 10.2 Toolchain
        run: |
          curl -L \
            "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf.tar.xz" \
            -o /tmp/gcc-arm.tar.xz

          sudo tar -xJf /tmp/gcc-arm.tar.xz -C /opt

          echo "/opt/gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf/bin" >> "$GITHUB_PATH"

      - name: Verify ARM Toolchain
        run: |
          arm-none-linux-gnueabihf-gcc --version
          arm-none-linux-gnueabihf-readelf --version

      - name: Build MiSTer Hi-Fi
        env:
          CC: arm-none-linux-gnueabihf-gcc
        run: |
          chmod +x fetch_miniaudio.sh build-mister.sh
          ./build-mister.sh

      - name: Verify Build Output
        run: |
          test -f Scripts/.config/MiSTerHiFi/mister_hifi
          test -f Scripts/.config/MiSTerHiFi/radio.example.json
          test -f Scripts/misterhifi.sh

          file Scripts/.config/MiSTerHiFi/mister_hifi
          arm-none-linux-gnueabihf-readelf -V Scripts/.config/MiSTerHiFi/mister_hifi

          grep -q '"stations"' Scripts/.config/MiSTerHiFi/radio.example.json

      - name: Package MiSTer Hi-Fi
        run: |
          rm -f MiSTer_Hi-Fi.zip
          zip -r MiSTer_Hi-Fi.zip Scripts

      - name: Verify Release Package
        run: |
          unzip -l MiSTer_Hi-Fi.zip
          unzip -l MiSTer_Hi-Fi.zip | grep -q 'Scripts/.config/MiSTerHiFi/mister_hifi'
          unzip -l MiSTer_Hi-Fi.zip | grep -q 'Scripts/.config/MiSTerHiFi/radio.example.json'
          unzip -l MiSTer_Hi-Fi.zip | grep -q 'Scripts/misterhifi.sh'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer_Hi-Fi
          path: MiSTer_Hi-Fi.zip
          if-no-files-found: error

  release:
    name: Create / Update Pre-release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: MiSTer_Hi-Fi
          path: release-assets

      - name: Verify Release Package
        run: |
          ls -lh release-assets
          test -f release-assets/MiSTer_Hi-Fi.zip

      - name: Update Git Tag
        run: |
          git tag -f Pre-release "$GITHUB_SHA"
          git push -f origin Pre-release

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Pre-release
          name: Pre-release
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: release-assets/MiSTer_Hi-Fi.zip
