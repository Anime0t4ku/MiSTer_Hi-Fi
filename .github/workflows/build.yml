name: MiSTer-Hi-Fi

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build MiSTer Hi-Fi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ARM Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf zip

      - name: Build MiSTer Hi-Fi
        env:
          CC: arm-linux-gnueabihf-gcc
        run: |
          chmod +x fetch_miniaudio.sh build-mister.sh
          ./build-mister.sh

      - name: Verify MiSTer Binary
        run: |
          test -f Scripts/.config/MiSTerHiFi/mister_hifi
          file Scripts/.config/MiSTerHiFi/mister_hifi

      - name: Package MiSTer Hi-Fi
        run: |
          rm -f MiSTer_Hi-Fi.zip
          zip -r MiSTer_Hi-Fi.zip Scripts

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer_Hi-Fi
          path: MiSTer_Hi-Fi.zip

  release:
    name: Create / Update Pre-release
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: MiSTer_Hi-Fi
          path: release-assets

      - name: Verify Release Package
        run: |
          ls -lh release-assets
          test -f release-assets/MiSTer_Hi-Fi.zip

      - name: Update Git Tag
        run: |
          git tag -f Pre-release
          git push -f origin Pre-release

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          tag: Pre-release
          artifacts: release-assets/MiSTer_Hi-Fi.zip
